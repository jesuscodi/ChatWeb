<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Línea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.min.css">
    <style>
        body { background-color: #f4f6f9; }
        #chat-box { height: 400px; overflow-y: auto; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 10px; }
        .msg { padding: 8px; border-radius: 8px; margin-bottom: 5px; }
        .msg-user { background-color: #d1e7dd; text-align: right; }
        .msg-other { background-color: #f8d7da; text-align: left; }
        emoji-picker { position: absolute; bottom: 60px; right: 20px; z-index: 10; }
    </style>
</head>
<body class="container py-4">

    <h1 class="text-center mb-4">💬 Chat en Línea</h1>

    <div id="login-section" class="text-center">
        <input type="text" id="username" class="form-control mb-2" placeholder="Escribe tu nombre">
        <button class="btn btn-primary w-100" id="start-chat">Entrar al Chat</button>
    </div>

    <div id="chat-section" style="display:none;">
        <div id="chat-box" class="mb-3"></div>
        <div class="input-group">
            <button class="btn btn-outline-secondary" id="emoji-btn">😊</button>
            <input type="text" id="message" class="form-control" placeholder="Escribe tu mensaje...">
            <button class="btn btn-success" id="send">Enviar</button>
        </div>
        <emoji-picker id="emoji-picker" style="display:none;"></emoji-picker>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
