<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Línea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Modal para pedir nombre -->
    <div class="modal fade" id="usernameModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <h5 class="modal-title">Ingresa tu nombre</h5>
                <input type="text" id="usernameInput" class="form-control my-2" placeholder="Tu nombre">
                <button class="btn btn-primary w-100" id="saveUsername">Entrar al chat</button>
            </div>
        </div>
    </div>

    <!-- Contenedor principal del chat -->
    <div class="container py-4">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white d-flex justify-content-between">
                <h5 class="mb-0">💬 Chat en Línea</h5>
                <button class="btn btn-sm btn-light" id="downloadChat">📥 Descargar Chat</button>
            </div>
            <div class="card-body chat-box" id="chatBox"></div>
            <div class="card-footer d-flex">
                <input type="text" id="messageInput" class="form-control me-2" placeholder="Escribe un mensaje...">
                <button class="btn btn-success" id="sendMessage">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
